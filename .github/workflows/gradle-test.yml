name: Gradle Test

on:
  workflow_call:
    inputs:
      java-version:
        description: "Java version (e.g. 21). If provided, java-version-file is ignored."
        required: false
        type: string
        default: ""
      java-version-file:
        description: "Java version file (e.g. build.gradle). Used if java-version is empty."
        required: false
        type: string
        default: "build.gradle"
      distribution:
        description: "Java distribution"
        required: false
        type: string
        default: "temurin"
      cache:
        description: "Java cache"
        required: false
        type: string
        default: "gradle"
      test-command:
        description: "Custom test command"
        required: false
        type: string
        default: "./gradlew test"
      upload-artifact:
        description: "Upload test results as artifact"
        required: false
        type: boolean
        default: false
      artifact-name:
        description: "Artifact name"
        required: false
        type: string
        default: "test-results"
      artifact-path:
        description: "Artifact path"
        required: false
        type: string
        default: "**/build/test-results/test/*.xml"

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Resolve Java version
        id: jv
        shell: bash
        run: |
          if [ -n "${{ inputs.java-version }}" ]; then
            echo "version=${{ inputs.java-version }}" >> "$GITHUB_OUTPUT"
          else
            # build.gradle から sourceCompatibility を抽出する
            FILE="${{ inputs.java-version-file }}"
            if [ -f "$FILE" ]; then
              V=$(grep "sourceCompatibility" "$FILE" | head -n 1 | sed -n "s/.*['\"]\(.*\)['\"].*/\1/p" || echo "")
              if [ -z "$V" ]; then
                V=$(grep "sourceCompatibility =" "$FILE" | head -n 1 | sed -n "s/.*= *\(.*\)/\1/p" | xargs || echo "")
              fi
            fi
            # それでも取れなければ LTS の 21 をデフォルトにする
            echo "version=${V:-21}" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          java-version: ${{ steps.jv.outputs.version }}
          distribution: ${{ inputs.distribution }}
          cache: ${{ inputs.cache }}

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Run tests
        run: ${{ inputs.test-command }}

      - name: Upload test results
        if: inputs.upload-artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ inputs.artifact-name }}
          path: ${{ inputs.artifact-path }}
