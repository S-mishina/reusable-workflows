name: Maven Test

on:
  workflow_call:
    inputs:
      java-version:
        description: "Java version (e.g. 21). If provided, java-version-file is ignored."
        required: false
        type: string
        default: ""
      java-version-file:
        description: "Java version file (e.g. pom.xml). Used if java-version is empty."
        required: false
        type: string
        default: "pom.xml"
      distribution:
        description: "Java distribution"
        required: false
        type: string
        default: "temurin"
      cache:
        description: "Java cache"
        required: false
        type: string
        default: "maven"
      test-command:
        description: "Custom test command"
        required: false
        type: string
        default: "./mvnw clean test"
      upload-artifact:
        description: "Upload test results as artifact"
        required: false
        type: boolean
        default: false
      artifact-name:
        description: "Artifact name"
        required: false
        type: string
        default: "test-results"
      artifact-path:
        description: "Artifact path"
        required: false
        type: string
        default: "**/target/surefire-reports/*.xml"

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Resolve Java version
        id: jv
        shell: bash
        run: |
          if [ -n "${{ inputs.java-version }}" ]; then
            echo "version=${{ inputs.java-version }}" >> "$GITHUB_OUTPUT"
          else
            # pom.xml から java.version を確実に抽出する（正規表現で安全に取得）
            FILE="${{ inputs.java-version-file }}"
            V=$(sed -n 's/.*<java.version>\([^<]*\)<\/java.version>.*/\1/p' "$FILE" | head -n 1 | xargs || echo "")
            if [ -z "$V" ]; then
              # フォールバックとして maven.compiler.source も確認
              V=$(sed -n 's/.*<maven.compiler.source>\([^<]*\)<\/maven.compiler.source>.*/\1/p' "$FILE" | head -n 1 | xargs || echo "")
            fi
            # それでも取れなければ LTS の 21 をデフォルトにする
            echo "version=${V:-21}" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          java-version: ${{ steps.jv.outputs.version }}
          distribution: ${{ inputs.distribution }}
          cache: ${{ inputs.cache }}

      - name: Run tests
        run: ${{ inputs.test-command }}

      - name: Upload test results
        if: inputs.upload-artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ inputs.artifact-name }}
          path: ${{ inputs.artifact-path }}
